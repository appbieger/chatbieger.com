<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ChatBieger — in Bearbeitung</title>
<link rel="icon" href="favicon.png">
<style>
  :root {
    --ground: #f5f5f7;
    --surface: #ffffff;
    --ink: #1d1d1f;
    --ink-soft: #6e6e73;
    --ink-faint: #86868b;
    --accent: #0066cc;
    --line: rgba(0, 0, 0, 0.09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #000000;
      --surface: #1c1c1e;
      --ink: #f5f5f7;
      --ink-soft: #a1a1a6;
      --ink-faint: #86868b;
      --accent: #4d9fff;
      --line: rgba(255, 255, 255, 0.12);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 30rem; width: 100%; text-align: left; }
  .wordmark {
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    margin: 0 0 2.5rem;
  }
  h1 {
    font-size: clamp(1.75rem, 6vw, 2.5rem);
    line-height: 1.15;
    letter-spacing: -0.02em;
    font-weight: 600;
    margin: 0 0 1rem;
  }
  p { margin: 0 0 1rem; color: var(--ink-soft); }
  p.lead { color: var(--ink); }
  footer {
    margin-top: 2.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
    font-size: 0.9375rem;
    color: var(--ink-faint);
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer a + a { margin-left: 1.25rem; }
</style>
</head>
<body>
<main>
  <p class="wordmark">ChatBieger</p>
  <h1>In Bearbeitung.</h1>
  <p class="lead">Wir bauen ChatBieger gerade von Grund auf neu.</p>
  <p>Die bisherige Seite und die öffentliche Demo sind währenddessen offline. Wir melden uns hier zurück, sobald es etwas zu zeigen gibt.</p>
  <footer>
    <a href="kontakt.html">Kontakt</a>
    <a href="impressum.html">Impressum</a>
    <a href="datenschutz.html">Datenschutz</a>
  </footer>
</main>
</body>
</html>
